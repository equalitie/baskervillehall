# Temporary postgres:16 instance — restore target during migration.
# Delete after migration is complete and main deployment is switched.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pg16-init
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-pg16-init
  template:
    metadata:
      labels:
        app: postgres-pg16-init
    spec:
      nodeSelector:
        kubernetes.io/hostname: postgres-node-73f188
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "postgres"
          effect: "NoSchedule"

      initContainers:
        - name: prestart-clean-shm
          image: busybox:1.36
          command: ["sh", "-c", "rm -f /dev/shm/PostgreSQL.* || true"]
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm

      volumes:
        - name: postgres-pv-storage
          persistentVolumeClaim:
            claimName: postgres-baskervillehall-pvc-pg16
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-baskervillehall-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "500m"
              memory: "2Gi"

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-pv-storage
            - mountPath: /dev/shm
              name: dshm

          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-baskervillehall-pg16
  labels:
    app: postgres-pg16-init
spec:
  selector:
    app: postgres-pg16-init
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
