# Migration job: dumps baskerville from postgres:11 and restores into postgres:16.
#
# IMPORTANT: scale down all writers BEFORE applying this job:
#   kubectl scale statefulset baskervillehall-storage --replicas=0
#   kubectl scale deployment incident-first-responder --replicas=0
#   kubectl scale statefulset alerts --replicas=0
#
# Scale them back up after step 5 (main deployment switched to pg16).
#
# Expected duration: ~30-60 min for 24 GB.
# Monitor with: kubectl logs -f job/postgres-migrate-pg16
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate-pg16
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: postgres-node-73f188
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "postgres"
          effect: "NoSchedule"

      containers:
        - name: migrate
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-baskervillehall-secret
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              SRC=postgres-baskervillehall
              DST=postgres-baskervillehall-pg16
              USER=postgres
              DB=baskerville

              echo "[1/3] Waiting for source (pg11)..."
              until pg_isready -h $SRC -U $USER; do sleep 2; done

              echo "[2/3] Waiting for target (pg16)..."
              until pg_isready -h $DST -U $USER; do sleep 2; done

              echo "[3/3] Creating database on target..."
              psql -h $DST -U $USER -c "CREATE DATABASE $DB;" 2>/dev/null || \
                echo "Database already exists, continuing..."

              echo "[4/4] Dumping from pg11 and restoring into pg16..."
              pg_dump -h $SRC -U $USER -d $DB | psql -h $DST -U $USER -d $DB

              echo "Migration complete."
